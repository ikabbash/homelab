# API server: PodSecurity admission (was: .cluster.apiServer.admissionControl)
apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
configuration:
  apiVersion: pod-security.admission.config.k8s.io/v1alpha1
  kind: PodSecurityConfiguration
  defaults:
    audit: restricted
    audit-version: latest
    enforce: restricted
    enforce-version: latest
    warn: restricted
    warn-version: latest
  exemptions:
    namespaces:
      - openebs
      - monitoring
---
# API server: audit policy (was: .cluster.apiServer.auditPolicy)
apiVersion: v1alpha1
kind: KubeAuditPolicyConfig
configuration:
  apiVersion: audit.k8s.io/v1
  kind: Policy
  rules:
    # Pod exec/attach/portforward
    - level: RequestResponse
      omitStages: ["RequestReceived"]
      resources:
        - group: ""
          resources: ["pods/exec", "pods/attach", "pods/portforward"]
      verbs: ["create", "get"]
    # Node proxy
    - level: RequestResponse
      omitStages: ["RequestReceived"]
      resources:
        - group: ""
          resources: ["nodes/proxy"]
      verbs: ["*"]
    # Secrets: Metadata only for most verbs, dropping VSO's reads
    # (RequestResponse would leak secret data)
    - level: None
      users:
        - "system:serviceaccount:vault-secrets-operator-system:vault-secrets-operator-controller-manager"
      resources:
        - group: ""
          resources: ["secrets"]
      verbs: ["get", "list", "watch"]
    - level: Metadata
      omitStages: ["RequestReceived"]
      resources:
        - group: ""
          resources: ["secrets"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # Cilium network policy changes (security relevant)
    - level: RequestResponse
      omitStages: ["RequestReceived"]
      resources:
        - group: "cilium.io"
          resources:
            - ciliumnetworkpolicies
            - ciliumclusterwidenetworkpolicies
      verbs: ["create", "update", "patch", "delete"]
    # RBAC changes
    - level: RequestResponse
      omitStages: ["RequestReceived"]
      resources:
        - group: "rbac.authorization.k8s.io"
          resources:
            - roles
            - rolebindings
            - clusterroles
            - clusterrolebindings
      verbs: ["create", "update", "patch", "delete"]
    # Privilege escalation signals
    - level: RequestResponse
      omitStages: ["RequestReceived"]
      resources:
        - group: ""
          resources: ["serviceaccounts"]
      verbs: ["create", "update", "patch", "delete"]
    - level: RequestResponse
      omitStages: ["RequestReceived"]
      resources:
        - group: ""
          resources: ["serviceaccounts/token"]
      verbs: ["create"]
    - level: Metadata
      omitStages: ["RequestReceived"]
      resources:
        - group: "certificates.k8s.io"
          resources: ["certificatesigningrequests"]
      verbs: ["create", "update", "delete"]
    # Workload writes
    - level: RequestResponse
      omitStages: ["RequestReceived"]
      resources:
        - group: ""
          resources: ["pods"]
      verbs: ["create"]
    - level: Metadata
      omitStages: ["RequestReceived"]
      resources:
        - group: "apps"
          resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
        - group: "batch"
          resources: ["jobs", "cronjobs"]
      verbs: ["create", "update", "patch", "delete"]
    # Admin and cluster-admin user writes
    - level: RequestResponse
      omitStages: ["RequestReceived"]
      users: ["admin"]
      verbs: ["create", "update", "patch", "delete"]
    - level: RequestResponse
      omitStages: ["RequestReceived"]
      userGroups: ["system:masters"]
      verbs: ["create", "update", "patch", "delete"]
    # Drop noisy system/health traffic
    - level: None
      users:
        - "system:serviceaccount:kube-system:cilium"
        - "system:serviceaccount:kube-system:cilium-operator"
      verbs: ["get", "list", "watch"]
    - level: None
      resources:
        - group: "cilium.io"
          resources:
            - ciliumnetworkpolicies
            - ciliumclusterwidenetworkpolicies
            - ciliumendpoints
            - ciliumnodes
            - ciliumidentities
      verbs: ["get", "list", "watch"]
    - level: None
      users:
        - "system:apiserver"
        - "system:kube-scheduler"
        - "system:kube-controller-manager"
      verbs: ["get", "list", "watch"]
    - level: None
      userGroups: ["system:nodes"]
      verbs: ["get", "list", "watch"]
    - level: None
      nonResourceURLs:
        - /healthz*
        - /readyz*
        - /livez*
        - /metrics
    # Drop everything else
    - level: None