# Kernel Modules
apiVersion: v1alpha1
kind: KernelModuleConfig
name: br_netfilter   # Required for Kubernetes networking
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvme-tcp       # Required for OpenEBS Mayastor
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: ext4           # Required for OpenEBS Mayastor
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: xfs            # Required for OpenEBS Mayastor
---
# Sysctls (was: .machine.sysctls)
apiVersion: v1alpha1
kind: SysctlConfig
params:
  net.core.somaxconn: "65535"                # Max queued connections
  net.core.netdev_max_backlog: "4096"        # Network device backlog
  net.netfilter.nf_conntrack_max: "131072"   # Avoid "table full" errors
  # CRITICAL for Cilium eBPF: needs relaxed rp_filter. Drop to "0" if you see asymmetric routing.
  net.ipv4.conf.all.rp_filter: "2"           # Loose mode reverse path filtering
  net.ipv4.conf.default.rp_filter: "2"       # Loose mode for new interfaces
  fs.aio-max-nr: "1048576"                   # More concurrent disk operations
  vm.nr_hugepages: "1024"                    # 2MiB huge pages, required by Mayastor