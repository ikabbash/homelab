operator:
  vulnerabilityScannerEnabled: true

  sbomGenerationEnabled: false
  clusterSbomCacheEnabled: false
  configAuditScannerEnabled: false
  rbacAssessmentScannerEnabled: false
  infraAssessmentScannerEnabled: false
  clusterComplianceEnabled: false
  exposedSecretScannerEnabled: false

  metricsImageInfo: false
  metricsVulnIdEnabled: true
  metricsExposedSecretInfo: false
  metricsConfigAuditInfo: false
  metricsRbacAssessmentInfo: false
  metricsInfraAssessmentInfo: false
  metricsClusterComplianceInfo: false

  builtInTrivyServer: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# in the default Standalone mode, every scan job downloads the full vulnerability DB
# into an ephemeral emptyDir and throws it away when the job finishes.
# ClientServer runs persistent trivy-server StatefulSet that downloads the DB once.
trivy:
  mode: "ClientServer"
  # Only for ClientServer mode
  storageClassEnabled: true
  storageClassName: "openebs-hostpath"
  storageSize: "10Gi"
  resources:
    requests:
      cpu: 100m
      memory: 100M
    limits:
      cpu: 500m
      memory: 500M
  server:
    podSecurityContext:
      runAsUser: 65534
      runAsNonRoot: true
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      privileged: false
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

# Off by default; writes report JSON to a PVC instead of CRDs
alternateReportStorage:
  enabled: false

serviceMonitor:
  enabled: true

# Deployment pod
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault
securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

# Image scan job pods
trivyOperator:
  scanJobPodTemplatePodSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  scanJobPodTemplateContainerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
  scanJobAutomountServiceAccountToken: false