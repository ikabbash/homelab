apiVersion: v1
kind: ConfigMap
metadata:
  name: glance-config
  namespace: glance
data:
  glance.yml: |
    theme:
      background-color: 222 40 5
      primary-color: 0 66 43
      positive-color: 160 100 44
      negative-color: 0 66 43
    pages:
      - name: Home
        columns:
          - size: small
            widgets:
              - type: clock
                hour-format: 24h
                timezones:
                  - timezone: Africa/Cairo
                    label: Cairo
                  - timezone: Asia/Dubai
                    label: Dubai (UAE)

              - type: markets
                title: Currency Watch
                markets:
                  - symbol: EGP=X
                    name: USD / EGP
                  - symbol: EUREGP=X
                    name: EUR / EGP

              - type: group
                widgets:
                  - type: weather
                    title: Alexandria
                    location: Alexandria, Egypt
                    units: metric
                    hour-format: 24h
                  - type: weather
                    title: New Cairo
                    location: New Cairo, Egypt
                    units: metric
                    hour-format: 24h

          - size: full
            widgets:
              - type: monitor
                title: Homelab Services
                cache: 1m
                sites:
                  - title: Argo CD
                    url: https://argocd.homelab.ikabbash.com
                    icon: di:argo-cd
                  - title: Authentik
                    url: https://authentik.homelab.ikabbash.com
                    icon: di:authentik
                  - title: Grafana
                    url: https://grafana.homelab.ikabbash.com
                    icon: di:grafana
                  - title: Prometheus
                    url: https://prometheus.homelab.ikabbash.com
                    icon: di:prometheus
                  - title: BentoPDF
                    url: https://bentopdf.homelab.ikabbash.com
                    icon: di:bentopdf
                  - title: changedetection.io
                    url: https://changedetection.homelab.ikabbash.com
                    icon: di:changedetection
                  - title: Miniflux
                    url: https://miniflux.homelab.ikabbash.com
                    icon: di:miniflux
                  - title: n8n
                    url: https://n8n.homelab.ikabbash.com
                    icon: di:n8n
                  - title: Vaultwarden
                    url: https://vaultwarden.homelab.ikabbash.com
                    icon: di:vaultwarden
                  - title: Vault
                    url: https://vault.homelab.ikabbash.com
                    icon: di:vault

              - type: hacker-news
                limit: 15
                collapse-after: 5

          - size: small
            widgets:
              - type: repository
                title: Homelab
                repository: ikabbash/homelab
                pull-requests-limit: 5
                issues-limit: 3
                commits-limit: 3

              - type: custom-api
                title: Talos Version
                cache: 1d
                subrequests:
                  latest-release:
                    url: https://api.github.com/repos/siderolabs/talos/releases/latest
                template: |
                  {{ $current := "v1.13.7" }}
                  {{ $latest := (.Subrequest "latest-release").JSON.String "tag_name" }}

                  <div class="flex items-center justify-between">
                    <div>
                      <div class="size-h6 color-base">RUNNING</div>
                      <div class="color-highlight size-h5">{{ $current }}</div>
                    </div>
                    <div>
                      <div class="size-h6 color-base">LATEST</div>
                      <div class="size-h5 {{ if eq $current $latest }}color-positive{{ else }}color-negative{{ end }}">{{ $latest }}</div>
                    </div>
                  </div>