apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: changedetection
  namespace: changedetection
specs:
  - endpointSelector:
      matchLabels:
        app: changedetection
    ingress:
      - fromEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: authentik
              app.kubernetes.io/instance: authentik
    egress:
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: kube-system
              k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: ANY
            rules:
              dns:
                - matchPattern: "*"
      - toEntities:
          - world
  - endpointSelector: {}
    ingress:
      - {}
    egress:
      - {}